name: Release

# Publica los binarios de COPIME Desktop Agent (CDA) como artefactos DESCARGABLES de un
# GitHub Release, junto a su SHA-256, cada vez que se empuja un tag `vX.Y.Z` a este repo.
#
# Motivo (TT11511): el contrato de entrega del instalador en ERP_Copime
# (`backend/src/modules/support-assets/agent/agent-installer.service.ts`) registra, por
# plataforma, el `file_name`/`version`/`sha256` vigente — pero ese registro lo escribe a
# mano un administrador, y hasta ahora no había ningún binario de CDA publicado en un
# lugar accesible desde el que copiar esos tres datos. Este workflow resuelve eso para
# macOS y Windows (las dos plataformas con una implementación real de `internal/inventory`
# hoy, TT11499/TT11512); Linux se agrega aquí el día que exista una implementación de ese
# collector. Windows se cross-compila desde este mismo runner (sin cgo, ver README) — la
# verificación real de que el binario arranca y se registra como servicio en Windows la
# cubre `build-windows.yml` en cada PR, no este workflow de publicación.
#
# El binario NO se autoinstala ni se autoregistra en ERP_Copime: un administrador sigue
# siendo quien decide, descarga y registra la versión vigente vía
# `PUT /support-assets/config/agent-installer` — este workflow solo le da algo real que
# descargar y un SHA-256 verificable para ese registro.
#
# Bundle .zip (TT11511, incidente de instalación real): publicar SOLO el binario suelto
# dejaba al usuario sin `install.bat`/`install.sh` — el propio manual de ERP_Copime da por
# sentado que vienen juntos, y sin el script el equipo "enrola" (el binario sin flags solo
# escribe la configuración) pero nunca entra en modo daemon ni queda registrado como
# servicio, así que el inventario nunca se alimenta. Este workflow sigue publicando los
# binarios sueltos (por si sirven para otro uso: instalación manual, depuración) y ADEMÁS
# empaqueta un `.zip` autosuficiente por plataforma con el binario + su(s) script(s) de
# instalación:
#   - macOS: ambos binarios SIN el sufijo de versión (`cda-darwin-arm64`, `cda-darwin-amd64`
#     — los nombres que `install/install.sh` busca junto a sí mismo según `uname -m`) +
#     `install.sh` + `com.conasinf.copime-agent.plist`.
#   - Windows: `install/install.bat` no distingue arquitectura (busca un `cda.exe` fijo,
#     sin selección por `uname`/variable de entorno equivalente); se empaqueta la variante
#     amd64, la que cubre la inmensa mayoría de equipos Windows reales — el binario arm64
#     sigue publicado suelto, sin zip, para instalación manual en los pocos equipos ARM.
on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag a publicar (p. ej. v0.2.0); requerido al disparar a mano"
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Resolver versión (sin la "v" del tag)
        id: ver
        run: |
          raw="${{ github.event.inputs.tag || github.ref_name }}"
          echo "version=${raw#v}" >> "$GITHUB_OUTPUT"

      - name: Compilar macOS arm64 (Apple Silicon)
        run: |
          GOOS=darwin GOARCH=arm64 go build \
            -ldflags "-X main.version=${{ steps.ver.outputs.version }}" \
            -o dist/cda-darwin-arm64-${{ steps.ver.outputs.version }} ./cmd/agent/

      - name: Compilar macOS amd64 (Intel)
        run: |
          GOOS=darwin GOARCH=amd64 go build \
            -ldflags "-X main.version=${{ steps.ver.outputs.version }}" \
            -o dist/cda-darwin-amd64-${{ steps.ver.outputs.version }} ./cmd/agent/

      - name: Compilar Windows amd64
        run: |
          GOOS=windows GOARCH=amd64 go build \
            -ldflags "-X main.version=${{ steps.ver.outputs.version }}" \
            -o dist/cda-windows-amd64-${{ steps.ver.outputs.version }}.exe ./cmd/agent/

      - name: Compilar Windows arm64
        run: |
          GOOS=windows GOARCH=arm64 go build \
            -ldflags "-X main.version=${{ steps.ver.outputs.version }}" \
            -o dist/cda-windows-arm64-${{ steps.ver.outputs.version }}.exe ./cmd/agent/

      - name: Empaquetar .zip de instalación por plataforma (TT11511)
        run: |
          set -euo pipefail
          VERSION="${{ steps.ver.outputs.version }}"

          mkdir -p dist/pkg-macos
          cp "dist/cda-darwin-arm64-${VERSION}" dist/pkg-macos/cda-darwin-arm64
          cp "dist/cda-darwin-amd64-${VERSION}" dist/pkg-macos/cda-darwin-amd64
          cp install/install.sh dist/pkg-macos/install.sh
          cp install/com.conasinf.copime-agent.plist dist/pkg-macos/com.conasinf.copime-agent.plist
          chmod +x dist/pkg-macos/cda-darwin-arm64 dist/pkg-macos/cda-darwin-amd64 dist/pkg-macos/install.sh
          (cd dist/pkg-macos && zip -X "../copime-agent-${VERSION}-macos.zip" cda-darwin-arm64 cda-darwin-amd64 install.sh com.conasinf.copime-agent.plist)

          mkdir -p dist/pkg-windows
          cp "dist/cda-windows-amd64-${VERSION}.exe" dist/pkg-windows/cda.exe
          cp install/install.bat dist/pkg-windows/install.bat
          (cd dist/pkg-windows && zip -X "../copime-agent-${VERSION}-windows.zip" cda.exe install.bat)

      - name: Checksums SHA-256
        run: |
          cd dist
          shasum -a 256 cda-darwin-arm64-${{ steps.ver.outputs.version }} \
                         cda-darwin-amd64-${{ steps.ver.outputs.version }} \
                         cda-windows-amd64-${{ steps.ver.outputs.version }}.exe \
                         cda-windows-arm64-${{ steps.ver.outputs.version }}.exe \
                         copime-agent-${{ steps.ver.outputs.version }}-macos.zip \
                         copime-agent-${{ steps.ver.outputs.version }}-windows.zip \
            > checksums-${{ steps.ver.outputs.version }}.txt
          cat checksums-${{ steps.ver.outputs.version }}.txt

      - name: Publicar GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          name: "CDA ${{ steps.ver.outputs.version }}"
          files: |
            dist/cda-darwin-arm64-${{ steps.ver.outputs.version }}
            dist/cda-darwin-amd64-${{ steps.ver.outputs.version }}
            dist/cda-windows-amd64-${{ steps.ver.outputs.version }}.exe
            dist/cda-windows-arm64-${{ steps.ver.outputs.version }}.exe
            dist/copime-agent-${{ steps.ver.outputs.version }}-macos.zip
            dist/copime-agent-${{ steps.ver.outputs.version }}-windows.zip
            dist/checksums-${{ steps.ver.outputs.version }}.txt
